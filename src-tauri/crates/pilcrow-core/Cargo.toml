[package]
name = "pilcrow-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vault file handling and the rebuildable SQLite index for Pilcrow. No Tauri dependency, so it tests in seconds."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
