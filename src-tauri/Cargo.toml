[package]
name = "pilcrow"
version = "0.10.0"
description = "Pilcrow - local-first Markdown reader with a file explorer"
authors = ["Michal Jašek"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace]
members = ["crates/pilcrow-core"]

[lib]
name = "pilcrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pilcrow-core = { path = "crates/pilcrow-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Jen kvůli verzi SQLite v sekci „O aplikaci“; samotný rejstřík je v jádru.
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
dotenvy = "0.15"

# Aktualizace z GitHub Releases. `process` je tu jen kvůli restartu aplikace
# po nainstalování aktualizace. Desktop only -- na mobilu updater neexistuje.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# This feature is used for production builds where `devUrl` points to the
# filesystem rather than a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
