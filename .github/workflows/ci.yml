# Testy na každý push a pull request.
#
# Sestavení instalátorů tady schválně není -- to patří do `release.yml` a trvá
# řádově déle. Tohle má odpovědět na jedinou otázku: je repozitář zelený?

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalace závislostí
        run: npm ci

      # `npm test` spouští typy, Rust, jádro i end-to-end. Vrstva trezoru
      # v Rustu je samostatný crate bez závislosti na Tauri, takže tenhle krok
      # nepotřebuje webkit2gtk ani nic dalšího ze systému.
      - name: Testy
        run: npm test
