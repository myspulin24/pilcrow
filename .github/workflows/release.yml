# Vydání nové verze.
#
# Spustí se na tag `v*` (například `v0.2.0`), sestaví instalátory, podepíše
# aktualizační balíčky soukromým klíčem ze secrets a vydá je jako release
# i s `latest.json`, na který se dívá updater v aplikaci.
#
# Soukromý klíč v repozitáři není a nikdy nebude -- žije výhradně v secrets
# tohohle repozitáře a v `.env` na stroji, kde se vydává ručně.

name: release

on:
  push:
    tags:
      - 'v*'
  # Ruční spuštění, když je potřeba release přestavět.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, ze kterého sestavit (například v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  # Testy jednou a dřív než cokoli jiného.
  #
  # Dřív si je spouštěla každá ze tří platforem sama, takže tři běhy mohly
  # dopadnout různě a release vznikl i ve chvíli, kdy `ci` na stejném commitu
  # spadlo. Teď je to jedna branka: neprojdou testy, nevydá se nic.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalace závislostí
        run: npm ci

      - name: Testy
        run: npm test

  # Vydání založí jeden job předem, buildy do něj jen nahrávají.
  #
  # Dokud si testy pouštěla každá platforma zvlášť, dorážely ke GitHubu
  # rozházeně v čase a na to, že si vydání zakládaly samy, se nepřišlo.
  # Se společnou brankou `test` startují naráz -- a tři souběžné pokusy
  # založit stejný release skončí `Error saving asset`.
  #
  # Zakládá se jako koncept: rozestavěné vydání tak neuvidí ani updater
  # (dívá se na `releases/latest`, a ten koncepty přeskakuje), ani nikdo,
  # kdo se zrovna kouká na stránku vydání.
  create-release:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Založit koncept vydání
        id: create
        run: |
          # Bez `pipefail`: `head -1` zavře rouru dřív, než `gh` dopíše, a to
          # by se s ním jinak počítalo jako s chybou.
          set -eu
          # Hledá se i mezi koncepty, takže opakované spuštění nezaloží druhý.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1 || true)
          if [ -z "$id" ]; then
            # Text přes soubor, ne přes `--notes "..."`: víceřádkový řetězec
            # přímo v YAML by si do vydání odnesl i odsazení bloku.
            cat > /tmp/notes.md <<'NOTES'
          Stáhni si instalátor pro svůj systém níž.

          Když už Pilcrow máš, nic stahovat nemusíš: aplikace si novou verzi
          najde sama a nabídne ji k instalaci.
          NOTES
            # Zakládá se přes API, ne přes `gh release create`, kvůli jediné
            # věci: odpověď rovnou obsahuje `id`. Ptát se na seznam vydání hned
            # po založení je závod -- GitHub ho má konzistentní se zpožděním
            # a první pokus o v0.3.0 na tom spadl.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f "tag_name=$TAG" \
                   -f "name=Pilcrow ${TAG#v}" \
                   -F "body=@/tmp/notes.md" \
                   -F draft=true -F prerelease=false \
                   --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "Vydání pro $TAG se nepodařilo najít ani založit." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    # Secrets nejdou použít přímo v `if:` u kroku, tak si je job přetáhne sem.
    # Prázdná hodnota znamená „certifikát nemáme“ a podpis se přeskočí.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri na Linuxu potřebuje webkit2gtk a příbuzné; na Windows a macOS
      # stačí to, co je v obrazu.
      - name: Systémové balíčky (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalace závislostí
        run: npm ci

      # Ikony nejsou v repozitáři, generují se ze stejného skriptu jako lokálně.
      - name: Ikony
        run: npm run icons

      # Celá sada už proběhla v jobu `test`; tady jde jen o to, co se chová
      # na každém systému jinak -- práce se soubory a cestami v Rustu.
      - name: Testy vrstvy trezoru na této platformě
        run: npm test -- rust

      # Podpis kódu pro Windows.
      #
      # Certifikát je vlastnoručně podepsaný, takže cizím Windows nic
      # nedokáže -- varování „Neznámý vydavatel“ zůstává. Co dokáže: do
      # instalátoru se zapíše, že ho podepsal Michal Jašek, a na počítači,
      # který ten certifikát zná, to Windows potvrdí. Razítko od DigiCertu
      # je tu proto, aby podpis platil i po vypršení certifikátu.
      #
      # Bez secrets se krok přeskočí a sestaví se nepodepsaná verze, místo
      # aby build spadl.
      - name: Podpis kódu (Windows)
        id: codesign
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          # Secret se do schránky GitHubu dostane jako text, a podle toho,
          # čím ho tam kdo nahrál, může začínat neviditelnou značkou pořadí
          # bajtů nebo končit odřádkováním. Base64 na to neumí reagovat jinak
          # než pádem, tak se všechno bílé i ta značka nejdřív odstraní.
          $raw = $env:WINDOWS_CERTIFICATE -replace '\s', '' -replace "`u{FEFF}", ''
          try {
            $bytes = [Convert]::FromBase64String($raw)
          } catch {
            throw "Secret WINDOWS_CERTIFICATE není platný base64. Nastav ho znovu příkazem ``gh secret set WINDOWS_CERTIFICATE < soubor.b64``."
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          # Heslo ze stejného soudku: odřádkování na konci by ho změnilo v jiné.
          $plain = $env:WINDOWS_CERTIFICATE_PASSWORD.Trim([char]0xFEFF, "`r", "`n", ' ')
          $password = ConvertTo-SecureString -String $plain -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          # Otisk v `tauri.codesign.conf.json` musí sedět na to, co jsme právě
          # naimportovali; jinak by se podepsalo něčím jiným, nebo vůbec.
          $expected = (Get-Content src-tauri/tauri.codesign.conf.json -Raw | ConvertFrom-Json).bundle.windows.certificateThumbprint
          if ($cert.Thumbprint -ne $expected) {
            throw "Certifikát ze secrets ($($cert.Thumbprint)) není ten z tauri.codesign.conf.json ($expected)."
          }
          "args=--config src-tauri/tauri.codesign.conf.json" >> $env:GITHUB_OUTPUT
          "Podepisuje: $($cert.Subject)"
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Nahrává se do vydání, které už existuje. Jméno ani text se tu
          # neuvádí schválně -- o obojí se postaral `create-release`, a kdyby
          # si je tři joby přepisovaly, je to zase závod.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Každý job přiloží do `latest.json` svoje platformy; tauri-action
          # je slučuje s tím, co v něm už je.
          includeUpdaterJson: true
          # Na Windows se sem přidá `--config` s otiskem certifikátu; jinde
          # a bez secrets je to prázdné.
          args: ${{ matrix.args }} ${{ steps.codesign.outputs.args }}

  # Koncept zveřejnit až ve chvíli, kdy jsou uvnitř všechny tři platformy.
  # Teprve tímhle krokem se vydání stane tím, co updater vidí jako `latest`.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Zveřejnit vydání
        run: |
          gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false -F prerelease=false
