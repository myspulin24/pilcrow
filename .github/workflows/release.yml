# Vydání nové verze.
#
# Spustí se na tag `v*` (například `v0.2.0`), sestaví instalátory, podepíše
# aktualizační balíčky soukromým klíčem ze secrets a vydá je jako release
# i s `latest.json`, na který se dívá updater v aplikaci.
#
# Soukromý klíč v repozitáři není a nikdy nebude -- žije výhradně v secrets
# tohohle repozitáře a v `.env` na stroji, kde se vydává ručně.

name: release

on:
  push:
    tags:
      - 'v*'
  # Ruční spuštění, když je potřeba release přestavět.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, ze kterého sestavit (například v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  # Testy jednou a dřív než cokoli jiného.
  #
  # Dřív si je spouštěla každá ze tří platforem sama, takže tři běhy mohly
  # dopadnout různě a release vznikl i ve chvíli, kdy `ci` na stejném commitu
  # spadlo. Teď je to jedna branka: neprojdou testy, nevydá se nic.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalace závislostí
        run: npm ci

      - name: Testy
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri na Linuxu potřebuje webkit2gtk a příbuzné; na Windows a macOS
      # stačí to, co je v obrazu.
      - name: Systémové balíčky (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalace závislostí
        run: npm ci

      # Ikony nejsou v repozitáři, generují se ze stejného skriptu jako lokálně.
      - name: Ikony
        run: npm run icons

      # Celá sada už proběhla v jobu `test`; tady jde jen o to, co se chová
      # na každém systému jinak -- práce se soubory a cestami v Rustu.
      - name: Testy vrstvy trezoru na této platformě
        run: npm test -- rust

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Reader_MJ __VERSION__'
          releaseBody: |
            Stáhni si instalátor pro svůj systém níž.

            Když už Reader_MJ máš, nic stahovat nemusíš: aplikace si novou
            verzi najde sama a nabídne ji k instalaci.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
